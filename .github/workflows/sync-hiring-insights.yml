name: Sync hiring insights

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync hiring insights from storyline.design
        run: node scripts/sync-hiring-insights.mjs

      - name: Commit updated insights
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync hiring insights from storyline.design"
          file_pattern: knowledge/hiring-insights/*
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
